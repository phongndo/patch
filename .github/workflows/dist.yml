name: Distribution

# Builds the release archives, then tests and installs them where each one runs. The
# Release workflow publishes exactly these archives, so none of this uses a build cache.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # scripts/release.ts has the same targets, and Release counts them.
        include:
          # Intel Macs are slow to build on, and Apple silicon builds for both.
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup target add ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: cargo build --release --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
        env:
          # Rust's own linker and libc: no musl tools to install.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          # The oldest macOS Rust supports on this processor.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'x86_64-apple-darwin' && '10.12' || '11.0' }}
      - run: bun scripts/release.ts package ${{ matrix.target }} cli/target/${{ matrix.target }}/release/patchr
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patchr-${{ matrix.target }}
          path: dist/release/*.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  install:
    name: Install ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, npm: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, npm: linux-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patchr-*
          path: dist/release
          merge-multiple: true
      - id: version
        run: |
          version=$(bun scripts/release.ts check)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test the binary in the archive
        env:
          ARCHIVE: patchr-v${{ steps.version.outputs.version }}-${{ matrix.target }}
        run: |
          tar -xzf "dist/release/$ARCHIVE.tar.gz" -C "$RUNNER_TEMP"
          PATCHR="$RUNNER_TEMP/$ARCHIVE/patchr" bun test ./tests/
      - name: Install script
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/script/.claude"
          HOME="$RUNNER_TEMP/script" PATCH_VERSION="$VERSION" PATCH_RELEASE_URL="file://$PWD/dist/release" sh scripts/install.sh
          [[ "$("$RUNNER_TEMP/script/.local/bin/patchr" --version)" == "$VERSION" ]]
          [[ -f "$RUNNER_TEMP/script/.claude/skills/patch/hooks/register.ts" ]]
      - name: npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.npm }}
        run: |
          bun scripts/release.ts npm
          packages="$PWD/dist/release/npm"
          mkdir -p "$RUNNER_TEMP/npm/home/.claude" && cd "$RUNNER_TEMP/npm"
          npm pack --silent "$packages/patchr" "$packages/patchr-$PLATFORM"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit "./phongndo-patchr-$PLATFORM-$VERSION.tgz" "./patchr-$VERSION.tgz"
          HOME="$PWD/home" ./node_modules/.bin/patchr install
          [[ "$(home/.local/bin/patchr --version)" == "$VERSION" ]]

  # One of each system: Installs tries the published formula on all four.
  homebrew:
    name: Homebrew (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patchr-*
          path: dist/release
          merge-multiple: true
      - uses: Homebrew/actions/setup-homebrew@dc7099b3e807f1e2ecc61f3ecabc840eedd5586a
      - run: |
          version=$(bun scripts/release.ts check)
          bun scripts/release.ts formula
          tap="$RUNNER_TEMP/tap"
          mkdir -p "$tap/Formula" "$RUNNER_TEMP/brew/.claude"
          sed "s#https://github.com/phongndo/patch/releases/download/v$version#file://$PWD/dist/release#" \
            dist/release/patchr.rb > "$tap/Formula/patchr.rb"
          git -C "$tap" init --quiet
          git -C "$tap" add Formula
          git -C "$tap" -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m formula
          brew tap patch/test "$tap"
          brew style patch/test/patchr
          brew install patch/test/patchr
          brew test patch/test/patchr
          HOME="$RUNNER_TEMP/brew" "$(brew --prefix)/bin/patchr" install
          [[ "$(readlink "$RUNNER_TEMP/brew/.local/bin/patchr")" == "$(brew --prefix)/opt/patchr/bin/patchr" ]]
