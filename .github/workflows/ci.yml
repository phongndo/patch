name: CI

# The same checks as the Git hooks (hk.pkl), each in a job of its own, in about half a minute.
# Rust is the one on the runner images. What depends on no platform runs on arm64, whose machines
# are the steadiest. The test jobs do their own setup because disks are slow and cold: it reads
# the compiler and linker while waiting on the network.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # As in package.json, which Lint checks, with the hashes of its archives.
  BUN_VERSION: "1.4.5"
  BUN_LINUX_SHA256: 94559b3b528995a49452f9f2404cec74f2efd7d06e0a000a8cd214b02c3666eb
  BUN_MACOS_SHA256: b5d6bc2e13caf14e57c89661e89efd073ff16165b41bfe43882616410609cd10
  # For the Jujutsu contract tests, which are skipped without it.
  JJ_VERSION: "0.41.0"
  JJ_LINUX_SHA256: 42181a80d316ac157874c817c9945e104275114fb461d99e06e2312502f08f99
  JJ_MACOS_SHA256: e84883b4fb42d1e0cb665efae95b44f387603c1280c893f8cbc7bbac7149ea30
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: '[[ "bun@$BUN_VERSION" == "$(bun -p ''require("./package.json").packageManager'')" ]]'
      - run: bun scripts/release.ts check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run format:rust
      - run: shellcheck scripts/install.sh
      - name: actionlint
        env:
          SHA256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz
          echo "$SHA256  actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint

  page:
    name: Page tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --parallel build:web test:web

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mkdir -p web/dist # embedded, so it must exist
      - run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - id: setup
        name: Get the source, Bun and jj
        shell: bash
        run: |
          # At once, and without the actions for them: they take several times as long.
          case "$RUNNER_OS" in
            Linux) bun=bun-linux-x64 sha=$BUN_LINUX_SHA256 jj=x86_64-unknown-linux-musl jjsha=$JJ_LINUX_SHA256 ;;
            macOS) bun=bun-darwin-aarch64 sha=$BUN_MACOS_SHA256 jj=aarch64-apple-darwin jjsha=$JJ_MACOS_SHA256 ;;
          esac
          git init -q . && git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" && git checkout -q FETCH_HEAD &
          source=$!
          # The compiler, off a cold disk, while the steps before it wait on the network.
          (cd "$(rustc --print sysroot)/lib" && cat ./*.{so,dylib}* rustlib/*/lib/*.rlib) >/dev/null 2>&1 &
          (echo 'fn main() {}' | rustc -o "$RUNNER_TEMP/warm" - && cargo --version) >/dev/null 2>&1 & # and the linker
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/$bun.zip"
          echo "$sha  $bun.zip" | shasum -a 256 --check --quiet
          unzip -q "$bun.zip"
          echo "$RUNNER_TEMP/$bun" >> "$GITHUB_PATH"
          jj="jj-v$JJ_VERSION-$jj.tar.gz"
          curl -fsSLO --retry 3 "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/$jj"
          echo "$jjsha  $jj" | shasum -a 256 --check --quiet
          mkdir jj && tar -xzf "$jj" -C jj
          echo "$RUNNER_TEMP/jj" >> "$GITHUB_PATH"
          wait "$source"
          echo "rust=$(rustc --version | tr -c 'a-z0-9.\n' -)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &built |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            cli/target
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.rust }}-${{ hashFiles('cli/Cargo.*') }}
      - run: mkdir -p web/dist && cp web/index.html web/dist/ # what the server needs of the page
      - run: bun run test
      # Dependencies only: Patch itself is always compiled.
      - if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        run: cargo clean --manifest-path cli/Cargo.toml --package patchr
      - if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *built
          key: ${{ steps.cache.outputs.cache-primary-key }}
