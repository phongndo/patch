name: Release

# Publishes the version on main:
#   bun run bump 0.2.0, commit, push to main, then
#   gh workflow run release.yml
# The archives are staged in a draft first. From then on that draft is the release: running this
# again, for an older one with -f version=0.1.0, carries on with those bytes, never new ones, and
# skips what is already published. The tag is the source plus nix/release.json, so the flake at a
# tag installs that version. The GitHub release, which curl, mise and Homebrew follow, goes public
# only after npm has it. npm needs the NPM_TOKEN secret until trusted publishing is set up for
# each package.

on:
  workflow_dispatch:
    inputs:
      version:
        description: A version already staged, to carry on with it. Empty for the one on main.
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || 'main' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Find what to release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # drafts are only listed to those who can write
    outputs:
      version: ${{ steps.find.outputs.version }}
      source: ${{ steps.find.outputs.source }}
      release: ${{ steps.find.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.version }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Run this on main"; exit 1; }
          current=$(bun scripts/release.ts check)
          version=${ASKED:-$current}
          version=${version#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a version: $version"; exit 1; }
          export TAG="v$version"
          # id, draft or published, how many files finished uploading, and the commit it was built from
          found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            .[] | select(.tag_name == env.TAG) |
            "\(.id) \(if .draft then "draft" else "published" end) \([.assets[] | select(.state == "uploaded")] | length) \(.target_commitish)"')
          [[ "$(grep -c . <<< "$found")" -le 1 ]] || { echo "::error::More than one release is $TAG: $found"; exit 1; }
          read -r release state files source <<< "$found" || true
          if [[ "$state" == draft && "$files" -lt 10 ]]; then
            # An interrupted upload, which nothing has used yet.
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release"
            release=""
          fi
          if [[ -n "$release" ]]; then
            [[ "$files" -eq 10 ]] || { echo "::error::$TAG is published with $files of 10 files"; exit 1; }
            [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$TAG does not say which commit it is: $source"; exit 1; }
          else
            [[ "$version" == "$current" ]] || { echo "::error::main is $current, and no $version is staged"; exit 1; }
            tags=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG")
            [[ -z "$tags" ]] || { echo "::error::$TAG is a tag without a release"; exit 1; }
            source=$GITHUB_SHA
          fi
          {
            echo "version=$version"
            echo "source=$source"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    if: needs.prepare.outputs.release == ''
    uses: ./.github/workflows/ci.yml

  dist:
    needs: prepare
    if: needs.prepare.outputs.release == ''
    uses: ./.github/workflows/dist.yml

  stage:
    name: Stage the release
    needs: [prepare, test, dist]
    # Tests and builds are skipped for what is already staged.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.release != '' || (needs.test.result == 'success' && needs.dist.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0 # the notes read the commits since the last tag
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Refuse to stage twice
        if: needs.prepare.outputs.release == ''
        run: |
          # Re-running only this job would not know of a draft it made before.
          export TAG="v$VERSION"
          found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG) | .id')
          [[ -z "$found" ]] || { echo "::error::$TAG is already staged. Start this workflow again rather than re-running its jobs."; exit 1; }
      - name: Take the built archives
        if: needs.prepare.outputs.release == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patchr-*
          path: dist/release
          merge-multiple: true
      - name: Or the archives already staged
        if: needs.prepare.outputs.release != ''
        env:
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          mkdir -p dist/release
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE" --jq '.assets[] | "\(.id) \(.name)"' |
            while read -r asset name; do
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "dist/release/$name"
            done
      - name: Check the archives
        working-directory: dist/release
        run: |
          [[ "$(find . -name '*.tar.gz' | wc -l)" -eq 4 ]]
          sha256sum --check ./*.sha256
      - if: needs.prepare.outputs.release == ''
        run: |
          bun scripts/release.ts formula
          cp scripts/install.sh dist/release/
      - if: needs.prepare.outputs.release == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*.tar.gz
      - name: Stage a draft
        if: needs.prepare.outputs.release == ''
        run: |
          bun scripts/release.ts notes "$SOURCE" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/release/* --draft --target "$SOURCE" \
            --title "Patch $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Tag the source with the hashes of its release
        run: |
          bun scripts/release.ts nix
          if git fetch --quiet --depth 1 origin "refs/tags/v$VERSION" 2>/dev/null; then
            git show FETCH_HEAD:nix/release.json | cmp - nix/release.json || { echo "::error::v$VERSION has other hashes"; exit 1; }
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/release.json
          git commit --quiet -m "chore(nix): patchr $VERSION"
          git push --quiet "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/tags/v$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged
          path: dist/release
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  npm:
    name: Publish to npm
    needs: [prepare, stage]
    if: ${{ !cancelled() && needs.stage.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged
          path: dist/release
      - run: bun scripts/release.ts npm
      - name: Publish the binaries, then the package that needs them
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # A late retry of an older version must not become npm's latest.
          newest=$(npm view @phongndo/patchr version 2>/dev/null || true)
          dist_tag=latest
          if [[ -n "$newest" && "$(printf '%s\n' "$newest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
            dist_tag=previous
          fi
          for folder in dist/release/npm/patchr-* dist/release/npm/patchr; do
            name=$(node -p "require('./$folder/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              published=$(mktemp -d)
              (cd "$published" && npm pack --silent "$name@$VERSION" >/dev/null && tar -xzf ./*.tgz)
              diff -r "$published/package" "$folder" || { echo "::error::npm has a different $name@$VERSION"; exit 1; }
              echo "$name@$VERSION is already published"
            else
              npm publish "./$folder" --provenance --access public --tag "$dist_tag"
            fi
          done
      - name: Wait until npm serves them
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # npm takes minutes over a first publication.
          for folder in dist/release/npm/patchr-* dist/release/npm/patchr; do
            name=$(node -p "require('./$folder/package.json').name")
            for _ in {1..60}; do
              npm view "$name@$VERSION" version --prefer-online >/dev/null 2>&1 && continue 2
              sleep 10
            done
            echo "::error::npm does not serve $name@$VERSION yet; run this workflow again once it does"
            exit 1
          done

  publish:
    name: Publish the GitHub release
    needs: [prepare, npm]
    if: ${{ !cancelled() && needs.npm.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            .[] | select(.draft | not) | .tag_name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$"))' | sort -V | tail -1)
          latest=false
          [[ "$(printf '%s\n' "$newest" "$TAG" | sort -V | tail -1)" != "$TAG" ]] || latest=true
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"

  nix:
    name: Point the flake at the release
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged
          path: dist/release
      - name: Commit nix/release.json to main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bun scripts/release.ts nix
          git clone --quiet --depth 1 --branch main "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/main"
          record="$PWD/nix/release.json"
          cd "$RUNNER_TEMP/main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            newest=$(jq -r .version nix/release.json 2>/dev/null || true)
            if [[ -n "$newest" && "$(printf '%s\n' "$newest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
              echo "main already has $newest"
              exit 0
            fi
            mkdir -p nix && cp "$record" nix/release.json
            git add nix/release.json
            git diff --cached --quiet && exit 0
            git commit --quiet -m "chore(nix): patchr $VERSION"
            git push --quiet && exit 0
            git fetch --quiet origin main && git reset --quiet --hard origin/main
          done
          exit 1

  homebrew:
    name: Notify the Homebrew tap
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the tap's hourly update will publish this version"
            exit 0
          fi
          gh api --method POST repos/phongndo/homebrew-tap/dispatches \
            -f event_type=patch-release -f "client_payload[release_tag]=$TAG"

  installs:
    name: Check published installs
    needs: [publish, nix, homebrew]
    if: ${{ !cancelled() && needs.nix.result == 'success' && needs.homebrew.result == 'success' }}
    uses: ./.github/workflows/installs.yml
